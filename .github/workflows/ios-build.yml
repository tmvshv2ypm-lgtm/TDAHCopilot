name: Build TDAH Copilot iOS (.ipa)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Compile TDAH Copilot on Xcode 27 Runner
    runs-on: xcode-27
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d /Applications/Xcode.app/Contents/Developer ]; then
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Build TDAHCopilot (Release - iOS Device)
        run: |
          set -o pipefail
          xcodebuild clean build \
            -project TDAHCopilot.xcodeproj \
            -scheme TDAHCopilot \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee xcodebuild.log

      - name: Surface Build Errors as Annotations
        if: failure()
        run: |
          python3 - << 'EOF'
          import os
          if not os.path.exists("xcodebuild.log"):
              print("::error::xcodebuild.log missing")
              raise SystemExit(0)
          with open("xcodebuild.log", errors="replace") as f:
              lines = f.read().splitlines()
          errs = list(dict.fromkeys(
              l.strip() for l in lines
              if ": error:" in l or "fatal error:" in l or "error: " in l
          ))
          if not errs:
              errs = [l.strip() for l in lines[-12:] if l.strip()]
          for line in errs[:8]:
              print(f"::error::{line[:350]}")
          EOF

      - name: Package Unsigned .ipa for Sideloading (AltStore / SideStore / Sideloadly)
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/TDAHCopilot.app Payload/
          zip -r TDAHCopilot-Unsigned.ipa Payload

      - name: Upload TDAHCopilot.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TDAHCopilot-iOS-IPA
          path: TDAHCopilot-Unsigned.ipa
          retention-days: 30
