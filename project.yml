name: TDAHCopilot
options:
  bundleIdPrefix: com.tdahcopilot
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
targets:
  TDAHCopilot:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TDAHCopilot
        excludes:
          - Resources/Info.plist
          - Resources/TDAHCopilot.entitlements
    info:
      path: TDAHCopilot/Resources/Info.plist
    entitlements:
      path: TDAHCopilot/Resources/TDAHCopilot.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tdahcopilot.app
        PRODUCT_NAME: TDAHCopilot
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: TDAHCopilot/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: TDAHCopilot/Resources/TDAHCopilot.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
